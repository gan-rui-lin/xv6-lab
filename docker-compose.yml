# xv6-lab Docker Compose 配置
# 使用方法: docker-compose up -d && docker-compose exec xv6 bash

version: '3.8'

services:
  xv6:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xv6-lab-dev
    
    # 挂载当前目录到容器
    volumes:
      - .:/xv6-lab
    
    # 工作目录
    working_dir: /xv6-lab
    
    # 保持容器运行
    stdin_open: true
    tty: true
    
    # 网络配置（用于 QEMU 网络功能）
    network_mode: host
    
    # 权限设置（用于 QEMU KVM 加速，如果可用）
    privileged: true
    
    # 环境变量
    environment:
      - TERM=xterm-256color
